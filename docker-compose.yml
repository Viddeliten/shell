services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      SITE_URL: http://localhost:8080
      DB_HOST: db
      DB_NAME: storybook
      DB_USER: storybook
      DB_PASSWORD: storybook
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: storybook
      MARIADB_USER: storybook
      MARIADB_PASSWORD: storybook
      MARIADB_ROOT_PASSWORD: local-root-password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: