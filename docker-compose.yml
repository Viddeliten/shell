services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      SITE_URL: http://localhost:${APP_PORT:-8080}
      SITE_NAME: ${SITE_NAME:-Example Site}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-site}
      DB_USER: ${DB_USER:-site}
      DB_PASSWORD: ${DB_PASSWORD:-site}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-site}
      MARIADB_USER: ${DB_USER:-site}
      MARIADB_PASSWORD: ${DB_PASSWORD:-site}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
